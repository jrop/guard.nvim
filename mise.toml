################################################################################
## Tools
################################################################################

[tools]
"asdf:mise-plugins/mise-lua" = { version = "5.1.5", install_env = { ASDF_LUA_LUAROCKS_VERSION = "3.12.2" } }
"aqua:neovim/neovim" = "0.12.6"
stylua = "2.6.0"
gh = "2.103.3"
"github:jrop/nvim-bundle" = "0.2.0"
cargo-binstall = "1.26.2"
"cargo:emmylua_ls" = { version = "0.25.1", depends = ["cargo-binstall"] }
"cargo:emmylua_check" = { version = "0.25.1", depends = ["cargo-binstall"] }

################################################################################
# Tasks
################################################################################

[tasks]
fmt = "stylua ."
"fmt:check" = "stylua --check ."

[tasks."test:prepare"]
run = 'eval "$(luarocks path)" && luarocks test --prepare'

[tasks."test:version"]
depends = ["test:prepare"]
usage = 'arg "<version>"'
run = '''
if [ "$usage_version" = nightly ]; then
  tool='vfox:jdx/vfox-neovim@nightly'
  # Refresh the rolling nightly when its checksum changed. The first run has no
  # install yet, so `mise exec` below performs that install.
  mise upgrade "$tool" >/dev/null 2>&1 || true
else
  tool="aqua:neovim/neovim@$usage_version"
fi
eval "$(luarocks path)"
mise exec "$tool" -- busted --verbose
'''

[tasks."test"]
run = 'mise run test:version 0.12.6'

[tasks."test:all"]
depends = ["test:prepare"]
run = '''
for v in 0.10.4 0.11.7 0.12.6 nightly; do
  mise run test:version "$v"
done
'''

[tasks."test:coverage"]
depends = ["test:prepare"]
run = '''
rm -f ./luacov.*.*
eval "$(luarocks path)"
busted --coverage --verbose
luacov
awk '/^Summary$/{flag=1;next} flag{print}' luacov.report.out
'''

[tasks."test:fast"]
description = "Run busted against the default Neovim without preparing dependencies"
run = '''
eval "$(luarocks path)"
busted --verbose
'''

[tasks.lint]
env.VIMRUNTIME = "{{ tools.neovim.path }}/share/nvim/runtime"
run = "emmylua_check --warnings-as-errors ."

[tasks."ci"]
run = '''
mise run fmt:check
mise run lint
mise run test:all
'''

[tasks.release]
description = "Publish the current v* tag as a GitHub release"
run = '''
set -eu

# `--exact-match` refuses a commit that is not itself tagged, so the version
# stamped below always names this exact release.
tag="$(git describe --tags --exact-match --match 'v*' HEAD 2>/dev/null)" || {
  echo "release: HEAD must be at a v* tag" >&2
  exit 1
}

git submodule update --init --recursive
test -z "$(git status --porcelain)" || {
  echo "release: working tree is not clean" >&2
  exit 1
}

mise run ci

# nvim-bundle defaults to `lua/` in and `dist/guard.lua` out. dist/ is
# gitignored, so building does not dirty the tree checked above.
nvim-bundle guard --bin

# The bundler copies module source verbatim, so stamping after the build is
# equivalent to stamping a source copy, without the copy or its temp path in
# the generated header.
sed "s/^local VERSION = '.*'$/local VERSION = '${tag#v}'/" dist/guard.lua > dist/guard.lua.new
mv dist/guard.lua.new dist/guard.lua
chmod +x dist/guard.lua

# Only the bundle has the shebang and the inlined parser, so check those.
./dist/guard.lua --version | grep -q "^guard ${tag#v} (Neovim "
nvim --clean -l - <<'LUA'
package.path = 'dist/?.lua;' .. package.path
assert(require('guard').string():parse('ok') == 'ok')
LUA

# Hash from inside dist so the checksum names `guard.lua`, as the README expects.
(cd dist && shasum -a 256 guard.lua > guard.lua.sha256)

gh release create "$tag" \
  dist/guard.lua \
  dist/guard.lua.sha256 \
  --generate-notes \
  --verify-tag
'''
